[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-jev"
version = "0.1.0"
description = "Typed, calibrated decisions for AI agents in PyTorch"
requires-python = ">=3.12"
dependencies = ["torch>=2.6,<3", "pydantic>=2.10,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
hf = ["transformers>=4.48,<6", "safetensors>=0.4"]
encoder = ["transformers>=4.48,<6", "safetensors>=0.4", "gliclass"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.12.4"]

[project.scripts]
open-jev = "open_jev.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/open_jev"]
